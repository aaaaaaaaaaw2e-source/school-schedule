<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание 10 классов</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>📅 Расписание 10 классов</h1>
      <p>Обновляется автоматически. Обновите страницу, чтобы увидеть свежие данные.</p>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>

  <table>
    <thead>
      <tr>
        <th class="lesson-num">Урок</th>
        <th class="day-header" data-day="0">Понедельник</th>
        <th class="day-header" data-day="1">Вторник</th>
        <th class="day-header" data-day="2">Среда</th>
        <th class="day-header" data-day="3">Четверг</th>
        <th class="day-header" data-day="4">Пятница</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <p class="status" id="status">Загрузка…</p>

</div>

<script>
const DAYS = 5;
let DATA = null;
let CURRENT = '10А';

async function load() {
  const status = document.getElementById('status');
  try {
    const res = await fetch('data.json?t=' + Date.now());
    DATA = await res.json();
    renderTabs();
    renderTable(CURRENT);
    status.textContent = 'Обновлено: ' + new Date().toLocaleString('ru-RU');
  } catch (e) {
    status.textContent = 'Ошибка загрузки: ' + e.message;
  }
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  Object.keys(DATA.classes).forEach(cls => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (cls === CURRENT ? ' active' : '');
    btn.textContent = cls;
    btn.onclick = () => {
      CURRENT = cls;
      renderTabs();
      renderTable(cls);
    };
    tabs.appendChild(btn);
  });
}

function renderTable(cls) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const grid = DATA.classes[cls].grid;

  grid.forEach((row, r) => {
    const tr = document.createElement('tr');

    const th = document.createElement('td');
    th.className = 'lesson-num';
    th.textContent = (r + 1) + ' урок';
    tr.appendChild(th);

    for (let d = 0; d < DAYS; d++) {
      const td = document.createElement('td');
      td.className = 'cell';
      td.dataset.day = d;
      td.textContent = row[d] || '';
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
}

load();
</script>
</body>
</html>
