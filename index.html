<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание 10 классов</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 id="title">📅 Расписание 10А — Группа 1</h1>
      <p>Обновляется автоматически. Обновите страницу, чтобы увидеть свежие данные.</p>
    </div>
  </header>

  <table>
    <thead>
      <tr>
        <th class="lesson-num">Урок</th>
        <th class="day-header" data-day="0">Понедельник</th>
        <th class="day-header" data-day="1">Вторник</th>
        <th class="day-header" data-day="2">Среда</th>
        <th class="day-header" data-day="3">Четверг</th>
        <th class="day-header" data-day="4">Пятница</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <p class="status" id="status">Загрузка…</p>

  <!-- Панель выбора класса и группы -->
  <div class="picker">
    <div class="picker-row">
      <span class="picker-label">Класс:</span>
      <div class="picker-btns" id="classBtns"></div>
    </div>
    <div class="picker-row">
      <span class="picker-label">Группа:</span>
      <div class="picker-btns" id="groupBtns"></div>
    </div>
  </div>

</div>

<script>
const DAYS = 5;
let DATA = null;
let CURRENT_CLASS = '10А';
let CURRENT_GROUP = '1';

async function load() {
  const status = document.getElementById('status');
  try {
    const res = await fetch('data.json?t=' + Date.now());
    DATA = await res.json();
    renderClassBtns();
    renderGroupBtns();
    renderTable();
    status.textContent = 'Обновлено: ' + new Date().toLocaleString('ru-RU');
  } catch (e) {
    status.textContent = 'Ошибка загрузки: ' + e.message;
  }
}

function renderClassBtns() {
  const box = document.getElementById('classBtns');
  box.innerHTML = '';
  Object.keys(DATA.classes).forEach(cls => {
    const b = document.createElement('button');
    b.className = 'pick-btn' + (cls === CURRENT_CLASS ? ' active' : '');
    b.textContent = cls;
    b.onclick = () => {
      CURRENT_CLASS = cls;
      renderClassBtns();
      renderTable();
    };
    box.appendChild(b);
  });
}

function renderGroupBtns() {
  const box = document.getElementById('groupBtns');
  box.innerHTML = '';
  ['1', '2'].forEach(g => {
    const b = document.createElement('button');
    b.className = 'pick-btn' + (g === CURRENT_GROUP ? ' active' : '');
    b.textContent = 'Группа ' + g;
    b.onclick = () => {
      CURRENT_GROUP = g;
      renderGroupBtns();
      renderTable();
    };
    box.appendChild(b);
  });
}

function renderTable() {
  document.getElementById('title').textContent =
    '📅 Расписание ' + CURRENT_CLASS + ' — Группа ' + CURRENT_GROUP;

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const grid = DATA.classes[CURRENT_CLASS][CURRENT_GROUP];

  grid.forEach((row, r) => {
    const tr = document.createElement('tr');
    const th = document.createElement('td');
    th.className = 'lesson-num';
    th.textContent = (r + 1) + ' урок';
    tr.appendChild(th);

    for (let d = 0; d < DAYS; d++) {
      const td = document.createElement('td');
      td.className = 'cell';
      td.dataset.day = d;
      td.textContent = row[d] || '';
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
}

load();
</script>
</body>
</html>
