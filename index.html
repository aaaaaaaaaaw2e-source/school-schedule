<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание школы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, Arial, sans-serif; background: #eef2f7; padding: 20px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header {
    background: #1e3a8a; color: #fff; padding: 24px;
    border-radius: 12px; margin-bottom: 20px;
  }
  header h1 { font-size: 22px; }
  header p { opacity: 0.8; font-size: 13px; margin-top: 6px; }
  table {
    width: 100%; border-collapse: collapse; background: #fff;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; font-size: 14px; }
  th { background: #1e3a8a; color: #fff; font-weight: 600; }
  th.lesson-num, td.lesson-num { background: #f1f5f9; font-weight: 700; width: 90px; }
  td { height: 52px; }
  td:empty::before { content: "—"; color: #cbd5e1; }
  .status { text-align: center; color: #64748b; font-size: 13px; margin-top: 14px; }
  @media (max-width: 700px) {
    th, td { font-size: 12px; padding: 4px; }
    header h1 { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="schoolName">📅 Расписание</h1>
    <p>Обновляется автоматически. Чтобы увидеть свежие данные — обновите страницу.</p>
  </header>

  <table>
    <thead>
      <tr>
        <th class="lesson-num">Урок</th>
        <th>Понедельник</th>
        <th>Вторник</th>
        <th>Среда</th>
        <th>Четверг</th>
        <th>Пятница</th>
        <th>Суббота</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <p class="status" id="status">Загрузка…</p>
</div>

<script>
const DAYS = 6;

async function load() {
  const status = document.getElementById('status');
  try {
    const res = await fetch('data.json?t=' + Date.now());
    const data = await res.json();

    document.getElementById('schoolName').textContent = '📅 ' + (data.school || 'Расписание');

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';

    data.grid.forEach((row, r) => {
      const tr = document.createElement('tr');

      const th = document.createElement('td');
      th.className = 'lesson-num';
      th.textContent = (r + 1) + ' урок';
      tr.appendChild(th);

      for (let d = 0; d < DAYS; d++) {
        const td = document.createElement('td');
        td.textContent = row[d] || '';
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    });

    status.textContent = 'Обновлено: ' + new Date().toLocaleString('ru-RU');
  } catch (e) {
    status.textContent = 'Ошибка загрузки: ' + e.message;
  }
}

load();
</script>
</body>
</html>
