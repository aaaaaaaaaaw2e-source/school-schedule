<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание — выбор класса</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📚 Расписание</h1>
      <p>Выберите класс, чтобы посмотреть расписание.</p>
    </div>
  </header>

  <div class="classes-panel">
    <div class="classes-title">Классы</div>
    <div class="classes-subtitle">Доступен пока только 10 класс.</div>
    <div class="classes-grid">
      <div class="class-card disabled"><span class="class-num">5</span><span class="class-label">Класс</span><span class="class-card-soon">🔒 Скоро</span></div>
      <div class="class-card disabled"><span class="class-num">6</span><span class="class-label">Класс</span><span class="class-card-soon">🔒 Скоро</span></div>
      <div class="class-card disabled"><span class="class-num">7</span><span class="class-label">Класс</span><span class="class-card-soon">🔒 Скоро</span></div>
      <div class="class-card disabled"><span class="class-num">8</span><span class="class-label">Класс</span><span class="class-card-soon">🔒 Скоро</span></div>
      <div class="class-card disabled"><span class="class-num">9</span><span class="class-label">Класс</span><span class="class-card-soon">🔒 Скоро</span></div>
      <a class="class-card available" href="schedule10.html"><span class="class-num">10</span><span class="class-label">Класс</span></a>
      <div class="class-card disabled"><span class="class-num">11</span><span class="class-label">Класс</span><span class="class-card-soon">🔒 Скоро</span></div>
    </div>
  </div>
</div>

<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Переключить тему">
  <span class="theme-icon">🌙</span>
  <span class="theme-text">Ночная</span>
</button>

<script>
const THEME_KEY = 'schedule_theme';
function applyTheme(theme) {
  const btn = document.getElementById('theme-toggle');
  const icon = btn.querySelector('.theme-icon');
  const text = btn.querySelector('.theme-text');
  if (theme === 'dark') {
    document.body.classList.add('dark');
    icon.textContent = '☀️'; text.textContent = 'Дневная';
  } else {
    document.body.classList.remove('dark');
    icon.textContent = '🌙'; text.textContent = 'Ночная';
  }
}
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY) || 'light';
  applyTheme(saved);
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const isDark = document.body.classList.contains('dark');
    const next = isDark ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  });
}
initTheme();
</script>
</body>
</html>
