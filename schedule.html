<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a14"><title>Расписание класса</title><link rel="stylesheet" href="style.css"><script>(()=>{try{if(localStorage.getItem('schedule_theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}})()</script></head><body><main class="shell"><nav class="topbar"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>SCHEDULE</span></a><a class="navlink" href="index.html">← Все классы</a></nav><header class="page-head"><span class="eyebrow">✦ расписание на неделю</span><h1 id="page-title">Расписание</h1><p class="muted">Выбери класс и группу, чтобы посмотреть уроки.</p></header><section class="glass" style="padding:20px"><div class="toolbar"><div><div class="muted" style="font-size:12px;margin-bottom:8px">КЛАСС</div><div class="pill-row" id="class-pills"></div></div><div><div class="muted" style="font-size:12px;margin-bottom:8px">ГРУППА</div><div class="pill-row" id="group-pills"></div></div></div><div class="status" id="week-status">Учебная неделя · понедельник — пятница</div></section><section class="schedule-wrap glass" style="margin-top:16px"><table class="schedule"><thead><tr><th>Урок</th><th>Понедельник</th><th>Вторник</th><th>Среда</th><th>Четверг</th><th>Пятница</th></tr></thead><tbody id="schedule-body"></tbody></table></section><section class="mobile-days" id="mobile-days"></section><footer class="footer">SCHEDULE · <span id="footer-class"></span></footer></main><button class="theme-toggle" id="theme-toggle" type="button">☼ Тема</button><script>
const DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница'];
const TIMES=[['08:30–09:15','09:30–10:15','10:30–11:15','11:30–12:15','12:35–13:20','13:40–14:25','14:40–15:25','15:35–16:20'],['08:30–09:15','09:30–10:15','10:30–11:15','11:30–12:15','12:35–13:20','13:40–14:25','14:45–15:30',''],['08:30–09:15','09:30–10:15','10:30–11:15','11:30–12:15','12:35–13:20','13:40–14:25','14:40–15:25','15:30–16:15'],['08:30–09:15','09:30–10:15','10:30–11:15','11:30–12:15','12:35–13:20','13:40–14:25','14:40–15:25',''],['08:30–09:15','09:30–10:15','10:30–11:15','11:30–12:15','12:35–13:20','13:40–14:25','14:40–15:25','15:40–16:25']];
let DATA={},currentClass=new URLSearchParams(location.search).get('class')||'10Г',currentGroup='Группа 2';
const $=id=>document.getElementById(id);function pill(container,label,active,fn){const b=document.createElement('button');b.className='pill'+(active?' active':'');b.textContent=label;b.onclick=fn;container.append(b)}
function render(){const groups=Object.keys(DATA[currentClass]||{});if(!groups.includes(currentGroup))currentGroup=groups[0]||'';$('page-title').textContent='Расписание '+currentClass;$('footer-class').textContent=currentClass+' · '+currentGroup;const cp=$('class-pills'),gp=$('group-pills');cp.replaceChildren();gp.replaceChildren();Object.keys(DATA).sort().forEach(c=>pill(cp,c,c===currentClass,()=>{currentClass=c;render();history.replaceState(null,'','?class='+encodeURIComponent(c))}));groups.forEach(g=>pill(gp,g,g===currentGroup,()=>{currentGroup=g;render()}));const grid=DATA[currentClass]?.[currentGroup]?.grid||[];const tbody=$('schedule-body');tbody.replaceChildren();for(let i=0;i<8;i++){const tr=document.createElement('tr'),th=document.createElement('th');th.textContent=(i+1)+' урок';tr.append(th);for(let d=0;d<5;d++){const td=document.createElement('td'),v=grid[i]?.[d]||'';td.textContent=v||'—';if(!v)td.className='empty';else td.className='lesson';const time=TIMES[d][i];if(time){const small=document.createElement('small');small.textContent=time;td.append(small)}tr.append(td)}tbody.append(tr)}const mobile=$('mobile-days');mobile.replaceChildren();DAYS.forEach((day,d)=>{const card=document.createElement('article');card.className='day-card glass';const h=document.createElement('h3');h.textContent=day;card.append(h);let count=0;for(let i=0;i<8;i++){const name=grid[i]?.[d]||'';if(!name)continue;count++;const row=document.createElement('div');row.className='lesson-row';const time=document.createElement('div');time.className='lesson-time';time.textContent=TIMES[d][i]||'';const subject=document.createElement('div');subject.className='lesson-name';subject.textContent=name;row.append(time,subject);card.append(row)}if(!count){const p=document.createElement('p');p.className='muted';p.textContent='Уроков нет';card.append(p)}mobile.append(card)})}
fetch('data.json?v='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{DATA=data;if(!DATA[currentClass])currentClass=Object.keys(DATA)[0];render()}).catch(e=>{$('page-title').textContent='Не удалось загрузить расписание';console.error(e)});
$('theme-toggle').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';if(light){document.documentElement.dataset.theme='light';localStorage.setItem('schedule_theme','light')}else{delete document.documentElement.dataset.theme;localStorage.setItem('schedule_theme','dark')}};
</script></body></html>
