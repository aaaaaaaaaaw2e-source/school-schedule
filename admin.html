<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель · SCHEDULE</title><link rel="stylesheet" href="style.css"><script>(()=>{try{if(localStorage.getItem('schedule_theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}})()</script></head><body><main class="shell"><nav class="topbar"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>SCHEDULE</span></a><a class="navlink" href="index.html">← На главную</a></nav><header class="page-head"><span class="eyebrow">✦ управление сайтом</span><h1>Админ-панель</h1><p class="muted">Загрузи данные из GitHub, отредактируй расписание и сохрани изменения.</p></header><section class="glass" style="padding:20px"><div class="admin-grid"><input class="field" id="owner" placeholder="GitHub username"><input class="field" id="repo" value="school-schedule" placeholder="Репозиторий"><input class="field" id="token" type="password" placeholder="GitHub token"></div><div class="toolbar"><button class="action" id="load">↓ Загрузить из GitHub</button><button class="action" id="save">Сохранить в GitHub</button><button class="action secondary" id="download">Скачать data.json</button></div><div class="message" id="message"></div></section><section class="glass" style="padding:20px;margin-top:16px"><div class="toolbar"><div><div class="muted" style="font-size:12px;margin-bottom:8px">КЛАСС</div><div class="pill-row" id="classes"></div></div><div><div class="muted" style="font-size:12px;margin-bottom:8px">ГРУППА</div><div class="pill-row" id="groups"></div></div></div><div class="schedule-wrap"><table class="admin-table"><thead><tr><th>Урок</th><th>Пн</th><th>Вт</th><th>Ср</th><th>Чт</th><th>Пт</th></tr></thead><tbody id="editor"></tbody></table></div><p class="muted" style="font-size:12px">Изменения применяются к выбранной группе. Не закрывай страницу до завершения сохранения.</p></section><footer class="footer">SCHEDULE · Панель управления</footer></main><button class="theme-toggle" id="theme-toggle">☼ Тема</button><script>
let DATA=null,sha=null,cls='10Г',grp='Группа 2';const $=id=>document.getElementById(id);function msg(s,err=false){const m=$('message');m.textContent=s;m.className='message show'+(err?' error':'')}function creds(){const owner=$('owner').value.trim(),repo=$('repo').value.trim(),token=$('token').value.trim();if(!owner||!repo||!token){msg('Заполни логин, репозиторий и токен GitHub.',true);return null}sessionStorage.setItem('gh_owner',owner);sessionStorage.setItem('gh_repo',repo);return{owner,repo,token}}function url(c){return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/data.json`}function decode(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}function encode(s){return btoa(unescape(encodeURIComponent(s)))}async function load(){const c=creds();if(!c)return;try{const r=await fetch(url(c)+'?t='+Date.now(),{headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub HTTP '+r.status);const j=await r.json();DATA=JSON.parse(decode(j.content));sha=j.sha;render();msg('Данные успешно загружены из GitHub.')}catch(e){msg('Не удалось загрузить: '+e.message,true)}}function render(){if(!DATA)return;if(!DATA[cls])cls=Object.keys(DATA)[0];if(!DATA[cls][grp])grp=Object.keys(DATA[cls])[0];$('classes').replaceChildren();$('groups').replaceChildren();Object.keys(DATA).forEach(c=>mkpill($('classes'),c,c===cls,()=>{cls=c;render()}));Object.keys(DATA[cls]).forEach(g=>mkpill($('groups'),g,g===grp,()=>{grp=g;render()}));const body=$('editor');body.replaceChildren();const grid=DATA[cls][grp].grid;for(let i=0;i<8;i++){const tr=document.createElement('tr'),th=document.createElement('th');th.textContent=(i+1)+' урок';tr.append(th);for(let d=0;d<5;d++){const td=document.createElement('td'),input=document.createElement('input');input.className='field';input.value=grid[i]?.[d]||'';input.setAttribute('aria-label',`${i+1} урок, день ${d+1}`);input.oninput=()=>{DATA[cls][grp].grid[i][d]=input.value.trim()};td.append(input);tr.append(td)}body.append(tr)}}function mkpill(parent,label,active,fn){const b=document.createElement('button');b.className='pill'+(active?' active':'');b.textContent=label;b.onclick=fn;parent.append(b)}async function save(){const c=creds();if(!c||!DATA)return;try{if(!sha){const check=await fetch(url(c),{headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'}});if(!check.ok)throw Error('Не удалось получить SHA файла: '+check.status);sha=(await check.json()).sha}const r=await fetch(url(c),{method:'PUT',headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Обновление школьного расписания',content:encode(JSON.stringify(DATA,null,2)),sha})});if(!r.ok)throw Error('GitHub HTTP '+r.status);const j=await r.json();sha=j.content.sha;msg('Сохранено в GitHub! Обычно Pages обновляется в течение нескольких минут.')}catch(e){msg('Ошибка сохранения: '+e.message,true)}}$('load').onclick=load;$('save').onclick=save;$('download').onclick=()=>{if(!DATA){msg('Сначала загрузи данные.',true);return}const a=document.createElement('a'),blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='data.json';a.click();URL.revokeObjectURL(a.href)};window.addEventListener('DOMContentLoaded',()=>{$('owner').value=sessionStorage.getItem('gh_owner')||'';$('repo').value=sessionStorage.getItem('gh_repo')||'school-schedule'});$('theme-toggle').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';if(light){document.documentElement.dataset.theme='light';localStorage.setItem('schedule_theme','light')}else{delete document.documentElement.dataset.theme;localStorage.setItem('schedule_theme','dark')}};
</script></body></html>
