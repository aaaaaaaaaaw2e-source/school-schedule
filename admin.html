<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ — Расписание</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>🔧 Админ-панель</h1>
      <p>Не давайте эту страницу никому — с токеном можно менять сайт.</p>
    </div>
  </header>

  <div class="panel">
    <input type="text" id="owner" placeholder="Владелец репо (логин)">
    <input type="text" id="repo"  placeholder="Имя репозитория" value="school-schedule">
    <input type="password" id="token" placeholder="GitHub-токен">
    <button class="btn btn-load" onclick="load()">📥 Загрузить</button>
  </div>

  <div class="panel">
    <input type="text" id="schoolName" placeholder="Название (например, 10А)">
    <button class="btn btn-save"  onclick="save()">💾 Сохранить для всех</button>
    <button class="btn btn-add"   onclick="addRow()">➕ Добавить урок</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ Печать</button>
  </div>

  <div id="msg" class="msg"></div>

  <table>
    <thead>
      <tr>
        <th class="lesson-num">Урок</th>
        <th class="day-header" data-day="0">Понедельник</th>
        <th class="day-header" data-day="1">Вторник</th>
        <th class="day-header" data-day="2">Среда</th>
        <th class="day-header" data-day="3">Четверг</th>
        <th class="day-header" data-day="4">Пятница</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

</div>

<script>
const DAYS = 5;
const LS_KEY = 'admin_creds_v1';
let sha = null;
let currentClass = '10А';

window.addEventListener('DOMContentLoaded', () => {
  const c = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
  document.getElementById('owner').value = c.owner || '';
  document.getElementById('repo').value  = c.repo  || 'school-schedule';
  document.getElementById('token').value = c.token || '';
});

function creds() {
  const owner = document.getElementById('owner').value.trim();
  const repo  = document.getElementById('repo').value.trim();
  const token = document.getElementById('token').value.trim();
  if (!owner || !repo || !token) {
    showMsg('Заполните владельца, репозиторий и токен.', 'err');
    return null;
  }
  localStorage.setItem(LS_KEY, JSON.stringify({ owner, repo, token }));
  return { owner, repo, token };
}

function apiUrl(c) {
  return `https://api.github.com/repos/${c.owner}/${c.repo}/contents/data.json`;
}

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + type;
  setTimeout(() => { m.className = 'msg'; }, 5000);
}

async function load() {
  const c = creds();
  if (!c) return;
  try {
    const res = await fetch(apiUrl(c) + '?t=' + Date.now(), {
      headers: { 'Authorization': 'token ' + c.token, 'Accept': 'application/vnd.github+json' }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const content = JSON.parse(
      decodeURIComponent(escape(atob(json.content.replace(/\n/g, ''))))
    );
    sha = json.sha;
    renderClassPicker(content);
    showMsg('Загружено из GitHub.', 'ok');
  } catch (e) {
    showMsg('Ошибка: ' + e.message, 'err');
  }
}

function renderClassPicker(data) {
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = '<strong>Выберите класс:</strong>';
  Object.keys(data.classes).forEach(cls => {
    const btn = document.createElement('button');
    btn.className = 'btn btn-load';
    btn.textContent = cls;
    btn.onclick = () => {
      currentClass = cls;
      document.getElementById('schoolName').value = cls;
      buildTable(data.classes[cls].grid);
    };
    panel.appendChild(btn);
  });
  document.querySelectorAll('.panel')[1].after(panel);
}

function buildTable(grid) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  grid.forEach((row, r) => {
    const tr = document.createElement('tr');
    const th = document.createElement('td');
    th.className = 'lesson-num';
    th.textContent = (r + 1) + ' урок';
    tr.appendChild(th);
    for (let d = 0; d < DAYS; d++) {
      const td = document.createElement('td');
      td.className = 'cell';
      td.contentEditable = 'true';
      td.dataset.day = d;
      td.textContent = row[d] || '';
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
}

function addRow() {
  const tbody = document.getElementById('tbody');
  const r = tbody.querySelectorAll('tr').length;
  const tr = document.createElement('tr');
  const th = document.createElement('td');
  th.className = 'lesson-num';
  th.textContent = (r + 1) + ' урок';
  tr.appendChild(th);
  for (let d = 0; d < DAYS; d++) {
    const td = document.createElement('td');
    td.className = 'cell';
    td.contentEditable = 'true';
    td.dataset.day = d;
    tr.appendChild(td);
  }
  tbody.appendChild(tr);
}

async function save() {
  const c = creds();
  if (!c) return;

  const grid = [];
  document.querySelectorAll('#tbody tr').forEach(tr => {
    const row = [];
    tr.querySelectorAll('td.cell').forEach(td => row.push(td.textContent.trim()));
    grid.push(row);
  });

  // Получаем текущие данные, обновляем нужный класс
  let full;
  try {
    const res = await fetch(apiUrl(c) + '?t=' + Date.now(), {
      headers: { 'Authorization': 'token ' + c.token, 'Accept': 'application/vnd.github+json' }
    });
    const json = await res.json();
    full = JSON.parse(decodeURIComponent(escape(atob(json.content.replace(/\n/g, '')))));
    sha = json.sha;
  } catch (e) {
    showMsg('Не удалось прочитать data.json', 'err');
    return;
  }

  full.classes[currentClass] = { grid };

  const body = {
    message: 'Обновление ' + currentClass + ' ' + new Date().toISOString(),
    content: btoa(unescape(encodeURIComponent(JSON.stringify(full, null, 2)))),
    sha
  };

  try {
    const res = await fetch(apiUrl(c), {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + c.token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    sha = json.content.sha;
    showMsg('Сохранено! Все увидят через 1–2 минуты.', 'ok');
  } catch (e) {
    showMsg('Ошибка сохранения: ' + e.message, 'err');
  }
}
</script>
</body>
</html>
