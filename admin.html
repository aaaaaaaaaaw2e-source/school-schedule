<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ — Расписание</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>🔧 Админ-панель</h1>
      <p>Выберите класс и группу, тыкайте в клетки и редактируйте.</p>
    </div>
    <button class="btn btn-save" onclick="save()">💾 Сохранить для всех</button>
  </header>

  <div class="admin-panel">
    <input type="text" id="owner" placeholder="Владелец репо (логин)" style="flex:1;">
    <input type="text" id="repo"  placeholder="Репозиторий" value="school-schedule" style="flex:1;">
    <input type="password" id="token" placeholder="GitHub-токен" style="flex:1;">
    <button class="btn btn-load" onclick="load()">📥 Загрузить</button>
  </div>

  <div id="msg" class="msg"></div>

  <div class="controls">
    <div class="control-row">
      <span class="control-label">Класс:</span>
      <div class="btn-group" id="class-btns"></div>
    </div>
    <div class="control-row">
      <span class="control-label">Группа:</span>
      <div class="btn-group" id="group-btns"></div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th class="lesson-num">Урок</th>
        <th class="day-header" data-day="0">Понедельник</th>
        <th class="day-header" data-day="1">Вторник</th>
        <th class="day-header" data-day="2">Среда</th>
        <th class="day-header" data-day="3">Четверг</th>
        <th class="day-header" data-day="4">Пятница</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

</div>

<script>
const DAYS = 5;
const LS_KEY = 'admin_creds_v3';
let DATA = null;
let CURRENT_CLASS = '10А';
let CURRENT_GROUP = 'Группа 1';
let sha = null;

window.addEventListener('DOMContentLoaded', () => {
  const c = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
  document.getElementById('owner').value = c.owner || '';
  document.getElementById('repo').value  = c.repo  || 'school-schedule';
  document.getElementById('token').value = c.token || '';
});

function creds() {
  const owner = document.getElementById('owner').value.trim();
  const repo  = document.getElementById('repo').value.trim();
  const token = document.getElementById('token').value.trim();
  if (!owner || !repo || !token) {
    showMsg('Заполните все поля', 'err');
    return null;
  }
  localStorage.setItem(LS_KEY, JSON.stringify({ owner, repo, token }));
  return { owner, repo, token };
}

function apiUrl(c) {
  return `https://api.github.com/repos/${c.owner}/${c.repo}/contents/data.json`;
}

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + type;
  setTimeout(() => { m.className = 'msg'; }, 4000);
}

async function load() {
  const c = creds();
  if (!c) return;
  try {
    const res = await fetch(apiUrl(c) + '?t=' + Date.now(), {
      headers: { 'Authorization': 'token ' + c.token, 'Accept': 'application/vnd.github+json' }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    DATA = JSON.parse(decodeURIComponent(escape(atob(json.content.replace(/\n/g, '')))));
    sha = json.sha;
    renderButtons();
    renderTable();
    showMsg('Загружено из GitHub.', 'ok');
  } catch (e) {
    showMsg('Ошибка: ' + e.message, 'err');
  }
}

function renderButtons() {
  if(!DATA) return;
  const classBtns = document.getElementById('class-btns');
  const groupBtns = document.getElementById('group-btns');
  classBtns.innerHTML = '';
  groupBtns.innerHTML = '';

  Object.keys(DATA).forEach(cls => {
    const btn = document.createElement('button');
    btn.className = 'ctrl-btn' + (cls === CURRENT_CLASS ? ' active' : '');
    btn.textContent = cls;
    btn.onclick = () => {
      CURRENT_CLASS = cls;
      renderButtons();
      renderTable();
    };
    classBtns.appendChild(btn);
  });

  Object.keys(DATA[CURRENT_CLASS]).forEach(grp => {
    const btn = document.createElement('button');
    btn.className = 'ctrl-btn' + (grp === CURRENT_GROUP ? ' active' : '');
    btn.textContent = grp;
    btn.onclick = () => {
      CURRENT_GROUP = grp;
      renderButtons();
      renderTable();
    };
    groupBtns.appendChild(btn);
  });
}

function renderTable() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const grid = DATA[CURRENT_CLASS][CURRENT_GROUP].grid;

  grid.forEach((row, r) => {
    const tr = document.createElement('tr');
    const th = document.createElement('td');
    th.className = 'lesson-num';
    th.textContent = (r + 1) + ' урок';
    tr.appendChild(th);

    for (let d = 0; d < DAYS; d++) {
      const td = document.createElement('td');
      td.className = 'cell';
      td.contentEditable = 'true';
      td.textContent = row[d] || '';
      td.addEventListener('input', () => {
        DATA[CURRENT_CLASS][CURRENT_GROUP].grid[r][d] = td.textContent.trim();
      });
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
}

async function save() {
  const c = creds();
  if (!c || !DATA) return;

  const body = {
    message: 'Обновление расписания ' + new Date().toISOString(),
    content: btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2)))),
    sha: sha
  };

  try {
    const res = await fetch(apiUrl(c), {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + c.token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    sha = json.content.sha;
    showMsg('Сохранено! Подождите 1-2 минуты.', 'ok');
  } catch (e) {
    showMsg('Ошибка сохранения: ' + e.message, 'err');
  }
}
</script>
</body>
</html>
